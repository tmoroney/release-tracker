name: Daily Download Snapshot

on:
  schedule:
    - cron: '0 6 * * *' # 6am UTC daily
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and record snapshot
        run: |
          SNAPSHOT_FILE="data/snapshots.json"

          # Initialize file if it doesn't exist
          if [ ! -f "$SNAPSHOT_FILE" ]; then
            echo '[]' > "$SNAPSHOT_FILE"
          fi

          # Fetch release data from GitHub API
          RELEASES_FILE=$(mktemp)
          curl -s "https://api.github.com/repos/tmoroney/auto-subs/releases?per_page=100" > "$RELEASES_FILE"

          # Use node to process the data and append snapshot
          node -e "
            const fs = require('fs');
            const releases = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const snapshots = JSON.parse(fs.readFileSync('$SNAPSHOT_FILE', 'utf8'));

            // Skip if a snapshot for today already exists (prevents duplicate same-day runs)
            const todayUTC = new Date().toISOString().slice(0, 10);
            if (snapshots.length > 0) {
              const lastDate = new Date(snapshots[snapshots.length - 1].timestamp).toISOString().slice(0, 10);
              if (lastDate === todayUTC) {
                console.log('Snapshot for ' + todayUTC + ' already exists, skipping duplicate run.');
                process.exit(0);
              }
            }

            const INSTALLER_EXTENSIONS = ['.pkg', '.deb', '.exe'];
            const isMacTarball = name => {
              const n = name.toLowerCase();
              return n.endsWith('.tar.gz') && (n.includes('apple-darwin') || n.includes('darwin') || n.includes('macos'));
            };
            const isInstaller = name => {
              const n = name.toLowerCase();
              return INSTALLER_EXTENSIONS.some(ext => n.endsWith(ext)) || isMacTarball(n);
            };

            let totalInstallerDownloads = 0;
            let latestJsonDownloads = 0;
            let latestJsonRelease = null;
            const perRelease = {};

            for (const release of releases) {
              if (!release.assets) continue;

              // Sum latest.json across all releases so the count never resets when a new release is published
              const lj = release.assets.find(a => a.name === 'latest.json');
              if (lj) {
                latestJsonDownloads += lj.download_count;
                if (!latestJsonRelease) latestJsonRelease = release.tag_name;
              }

              let releaseTotal = 0;
              for (const asset of release.assets) {
                if (isInstaller(asset.name)) {
                  releaseTotal += asset.download_count;
                }
              }
              if (releaseTotal > 0) {
                perRelease[release.tag_name] = releaseTotal;
                totalInstallerDownloads += releaseTotal;
              }
            }

            const snapshot = {
              timestamp: new Date().toISOString(),
              totalInstallerDownloads,
              latestJsonDownloads,
              latestJsonRelease,
              perRelease,
            };

            snapshots.push(snapshot);
            fs.writeFileSync('$SNAPSHOT_FILE', JSON.stringify(snapshots, null, 2));

            // Generate shields.io endpoint badge JSON files
            const fmtNum = n => n >= 1000000 ? (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n);
            const msPerDay = 86400000;

            // Returns the actual total of `field` over the last `windowDays` days of snapshots.
            function windowedTotal(snaps, field, windowDays) {
              if (snaps.length < 2) return null;
              const latest = snaps[snaps.length - 1];
              const cutoff = new Date(latest.timestamp).getTime() - windowDays * msPerDay;
              let total = 0;
              let hasDeltas = false;

              for (let i = 1; i < snaps.length; i++) {
                const prev = snaps[i - 1];
                const curr = snaps[i];
                if (new Date(curr.timestamp).getTime() < cutoff) continue;

                const delta = curr[field] - prev[field];
                if (delta >= 0) {
                  total += delta;
                  hasDeltas = true;
                }
              }

              return hasDeltas ? total : null;
            }

            function dailyRateFromLatestPair(snaps, field) {
              if (snaps.length < 2) return null;
              const latest = snaps[snaps.length - 1];
              const prev = snaps[snaps.length - 2];
              const daysBetween = (new Date(latest.timestamp) - new Date(prev.timestamp)) / msPerDay;
              if (daysBetween <= 0) return null;
              return Math.round((latest[field] - prev[field]) / daysBetween);
            }

            // Compute active user estimates
            let dailyAU, weeklyAU, monthlyAU;
            if (snapshots.length >= 2) {
              dailyAU = dailyRateFromLatestPair(snapshots, 'latestJsonDownloads');
            } else {
              // Fallback: use oldest release with latest.json as baseline so a brand-new release
              // doesn't collapse daysSincePublish to 1 and inflate the estimate.
              const releasesWithLj = releases.filter(r => r.assets && r.assets.some(a => a.name === 'latest.json'));
              if (releasesWithLj.length > 0) {
                const oldestRelease = releasesWithLj[releasesWithLj.length - 1];
                const daysSincePublish = Math.max(1, (Date.now() - new Date(oldestRelease.published_at).getTime()) / msPerDay);
                dailyAU = Math.round(latestJsonDownloads / daysSincePublish);
              } else {
                dailyAU = 0;
              }
            }
            dailyAU = Math.max(0, dailyAU ?? 0);
            weeklyAU = windowedTotal(snapshots, 'latestJsonDownloads', 7) ?? dailyAU * 7;
            monthlyAU = windowedTotal(snapshots, 'latestJsonDownloads', 30) ?? dailyAU * 30;

            // Compute new-installer-downloads over the last 7 days
            const weeklyDownloads = windowedTotal(snapshots, 'totalInstallerDownloads', 7) ?? 0;

            const badges = {
              'badge-downloads': { schemaVersion: 1, label: 'downloads', message: fmtNum(totalInstallerDownloads), color: '0078d4' },
              'badge-weekly-users': { schemaVersion: 1, label: 'weekly app opens', message: fmtNum(weeklyAU), color: 'f0883e' },
              'badge-daily-users': { schemaVersion: 1, label: 'daily app opens', message: fmtNum(dailyAU), color: 'f0883e' },
              'badge-monthly-users': { schemaVersion: 1, label: 'monthly app opens', message: fmtNum(monthlyAU), color: 'f0883e' },
              'badge-weekly-downloads': { schemaVersion: 1, label: 'new downloads / week', message: weeklyDownloads > 0 ? fmtNum(weeklyDownloads) : 'N/A', color: '34c759' },
            };

            for (const [name, badge] of Object.entries(badges)) {
              fs.writeFileSync('data/' + name + '.json', JSON.stringify(badge));
            }

            console.log('Snapshot recorded:', JSON.stringify(snapshot, null, 2));
            console.log('Badges generated:', Object.keys(badges).join(', '));
          " "$RELEASES_FILE"

          rm -f "$RELEASES_FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "snapshot: daily download counts $(date -u +%Y-%m-%d)"
          git push

      - name: Trigger deployment
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
